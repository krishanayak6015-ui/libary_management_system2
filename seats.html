{% extends "main/base.html" %}{% block content %}<h2>Seat Booking</h2><div class="card p-3 mt-3"><table class="table"><thead><tr><th>Student</th><th>Seat</th><th>Date</th><th>Status</th></tr></thead><tbody>{% for b in bookings %}<tr><td>{{ b.student }}</td><td>{{ b.seat_number }}</td><td>{{ b.booking_date }}</td><td>{{ b.status }}</td></tr>{% empty %}<tr><td colspan="4">No seat bookings yet. Add records through Django admin.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
