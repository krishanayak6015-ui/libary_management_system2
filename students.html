{% extends "main/base.html" %}{% block content %}<h2>Student Management</h2><div class="card p-3 mt-3"><table class="table"><thead><tr><th>Student</th><th>Student ID</th><th>Course</th><th>Phone</th></tr></thead><tbody>{% for s in students %}<tr><td>{{ s }}</td><td>{{ s.student_id }}</td><td>{{ s.course|default:"—" }}</td><td>{{ s.phone|default:"—" }}</td></tr>{% empty %}<tr><td colspan="4">No student profiles yet. Add them through Django admin.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
