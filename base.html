<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Librify Library{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f5f7fb;color:#20283b;font-family:Arial,sans-serif}.navbar{background:#172554}.navbar-brand,.nav-link{color:white!important}.hero{background:linear-gradient(120deg,#172554,#2563eb);color:white;border-radius:22px;padding:55px}.card{border:0;border-radius:16px;box-shadow:0 5px 22px #17255412}.btn-primary{background:#2563eb;border:0}.page{padding-top:35px;padding-bottom:50px}.muted{color:#64748b}
</style></head><body>
<nav class="navbar navbar-expand-lg"><div class="container"><a class="navbar-brand fw-bold" href="{% url 'home' %}">📚 Librify</a>
<button class="navbar-toggler bg-light" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="nav"><div class="navbar-nav ms-auto">
<a class="nav-link" href="{% url 'home' %}">Home</a>
{% if user.is_authenticated %}<a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a><a class="nav-link" href="{% url 'books' %}">Books</a><a class="nav-link" href="{% url 'students' %}">Students</a><a class="nav-link" href="{% url 'seats' %}">Seat Booking</a><a class="nav-link" href="{% url 'attendance' %}">Attendance</a><a class="nav-link" href="{% url 'payments' %}">Payments</a><a class="nav-link" href="{% url 'logout' %}">Logout</a>{% else %}<a class="nav-link" href="{% url 'login' %}">Login</a><a class="nav-link" href="{% url 'signup' %}">Signup</a>{% endif %}
</div></div></div></nav>
<main class="container page">{% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>
<footer class="text-center py-4 muted">© 2026 Librify · Library Management System</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
