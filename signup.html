{% extends "main/base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-md-6"><div class="card p-4"><h2>Create account</h2><p class="muted">Join Librify to manage your library.</p><form method="post">{% csrf_token %}<label class="form-label">Username</label><input class="form-control mb-3" name="username" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email"><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100">Create account</button></form><p class="mt-3">Already registered? <a href="{% url 'login' %}">Login</a></p></div></div></div>{% endblock %}
