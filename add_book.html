{% extends "main/base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-md-7"><div class="card p-4"><h2>Add a book</h2><form method="post">{% csrf_token %}<label class="form-label">Book title</label><input class="form-control mb-3" name="title" required><label class="form-label">Author</label><input class="form-control mb-3" name="author" required><label class="form-label">Category</label><input class="form-control mb-3" name="category"><label class="form-label">ISBN</label><input class="form-control mb-3" name="isbn"><label class="form-label">Total copies</label><input class="form-control mb-3" type="number" min="1" name="total_copies" value="1"><button class="btn btn-primary">Save book</button></form></div></div></div>{% endblock %}
