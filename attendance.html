{% extends "main/base.html" %}{% block content %}<h2>Attendance</h2><div class="card p-3 mt-3"><table class="table"><thead><tr><th>Student</th><th>Date</th><th>Status</th></tr></thead><tbody>{% for a in records %}<tr><td>{{ a.student }}</td><td>{{ a.attendance_date }}</td><td>{{ a.status }}</td></tr>{% empty %}<tr><td colspan="3">No attendance records yet. Add records through Django admin.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
