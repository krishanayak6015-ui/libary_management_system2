{% extends "main/base.html" %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h2>Books</h2><a class="btn btn-primary" href="{% url 'add_book' %}">+ Add book</a></div><form class="mb-3"><input class="form-control" name="q" placeholder="Search title or author..." value="{{ request.GET.q }}"></form><div class="card p-3"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Title</th><th>Author</th><th>Category</th><th>Available</th><th>Total</th></tr></thead><tbody>{% for b in books %}<tr><td>{{ b.title }}</td><td>{{ b.author }}</td><td>{{ b.category|default:"—" }}</td><td>{{ b.available_copies }}</td><td>{{ b.total_copies }}</td></tr>{% empty %}<tr><td colspan="5">No books found.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
