{% extends "main/base.html" %}{% block content %}<h2>Payments</h2><div class="card p-3 mt-3"><table class="table"><thead><tr><th>Student</th><th>Amount</th><th>Date</th><th>Purpose</th><th>Status</th></tr></thead><tbody>{% for p in payments %}<tr><td>{{ p.student }}</td><td>₹{{ p.amount }}</td><td>{{ p.payment_date }}</td><td>{{ p.purpose }}</td><td>{{ p.status }}</td></tr>{% empty %}<tr><td colspan="5">No payment records yet. Add records through Django admin.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
